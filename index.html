<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Кафе Утро</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header class="header">

    <div class="header__container">

        <a href="#" class="logo">
            <img src="./images/logo.svg" alt="Кафе Утро">
        </a>

        <nav class="navigation">
            <a href="#">Главная</a>
            <a href="#">Меню</a>
            <a href="#">О нас</a>
            <a href="#">Контакты</a>
        </nav>

        <a href="#" class="booking-button">
            Забронировать стол
        </a>

        <button class="burger" aria-label="Открыть меню">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </div>

</header>


<main>
    <section class="hero">

        <div class="hero__content">

            <div class="hero__text">

                <h1>
                    Вкусные<br>
                    завтраки каждый<br>
                    день
                </h1>

                <p>
                    Ароматный кофе, свежая выпечка<br>
                    и уютная атмосфера.
                </p>

                <a href="#" class="booking-button hero__button">
                    Забронировать стол
                </a>

            </div>

            <img
                class="hero__image"
                src="./images/main.png"
                alt="Кофе и круассан"
            >

        </div>

    </section>


    <section class="benefits">

        <div class="benefits__container">

            <article class="benefit-card">

                <img
                    class="benefit-card__icon"
                    src="./images/icon-1.svg"
                    alt=""
                >

                <div class="benefit-card__text">

                    <h2>
                        Свежий кофе
                    </h2>

                    <p>
                        Лучшие зерна<br>
                        каждый день.
                    </p>

                </div>

            </article>


            <article class="benefit-card">

                <img
                    class="benefit-card__icon"
                    src="./images/icon-2.svg"
                    alt=""
                >

                <div class="benefit-card__text">

                    <h2>
                        Свежая выпечка
                    </h2>

                    <p>
                        Ароматные круассаны<br>
                        и десерты.
                    </p>

                </div>

            </article>


            <article class="benefit-card">

                <img
                    class="benefit-card__icon"
                    src="./images/icon-3.svg"
                    alt=""
                >

                <div class="benefit-card__text">

                    <h2>
                        Уютное место
                    </h2>

                    <p>
                        Идеально для работы<br>
                        и встреч.
                    </p>

                </div>

            </article>

        </div>

    </section>

</main>

</body>
</html>
